approvedGitRepositories:
  - "**"

enableGlobalCache: true

npmScopes:
  connor-adams:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAuthToken: "${NODE_AUTH_TOKEN:-}"
    # Keep the @connor-adams scope's age gate at 0: our own private packages
    # (designsystem, tokens) are frequently published <24h before an install and
    # would otherwise be quarantined. The scoped value overrides the global one
    # for this registry only — the global gate below still guards every public dep.
    npmMinimalAgeGate: 0

# Supply-chain hardening (issue #828): do NOT run install scripts for arbitrary
# packages. A compromised transitive dep's postinstall would otherwise execute on
# every `yarn install` (dev, CI, Railway build). The few packages that genuinely
# need a native build are allowlisted via `dependenciesMeta.<pkg>.built: true` in
# package.json (esbuild, sqlite3).
enableScripts: false

nmMode: hardlinks-local

nodeLinker: node-modules

# Global npm cooldown: quarantine versions published less than 1 day ago, blocking
# just-published (potentially account-takeover/typosquat) malware. Scoped registries
# can override this (see npmScopes.connor-adams above).
npmMinimalAgeGate: 1440
