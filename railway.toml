[build]
builder = "RAILPACK"
buildCommand = "yarn workspace cashflow-backend run build"
watchPatterns = [
  "backend/**",
  "shared/**",
  "package.json",
  "yarn.lock",
  "railway.toml"
]

[deploy]
startCommand = "yarn workspace cashflow-backend run start"
preDeployCommand = "yarn workspace cashflow-backend run db:migrate"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
