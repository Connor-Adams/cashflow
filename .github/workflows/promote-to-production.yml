name: promote-to-production

# Publishing a release pins a version: every service is stamped :<tag>, and the
# services whose image actually changed get :production moved onto them.
#
# It does NOT deploy. The Dokploy panel is on a LAN address, unreachable from a
# GitHub-hosted runner, so the redeploy is a human step — the run summary names
# exactly which services need it. Dokploy's own per-application deploy webhook
# (`POST /api/deploy/<refreshToken>`, autoDeploy already enabled) is what a
# future automation should call if the panel is ever exposed; nothing else here
# needs to change for that.
#
# History: this job used to run `railway redeploy` as its last step. Railway was
# retired 2026-09-26, so that call began failing with "Project has no services."
# Under `set -e` it aborted the whole loop, and v0.13.187 promoted a re-tagged
# backend against an untouched frontend. Hence the per-service fault isolation.

on:
  release:
    types: [published]
  # Re-promote an existing release — finishes a run that failed part-way
  # without cutting a new version.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote, e.g. v0.13.187
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-to-production
  cancel-in-progress: false

env:
  IMAGE_WAIT_ATTEMPTS: 30
  IMAGE_WAIT_SECONDS: 10

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      REPO: ${{ github.repository }}
    steps:
      # Check out the released commit so we can recompute each service's content
      # hash exactly as build-images.yml did. `ref: <tag>` resolves annotated
      # tags to their commit transparently.
      - name: Check out release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve each service by its content hash (:tree-<hash>), stamp every
      # service with the release version tag, and re-tag :production for the
      # services whose image differs from what production serves. Images are NOT
      # rebuilt here — build-images.yml already pushed :tree-<hash>.
      # Design: docs/superpowers/specs/2026-06-02-skip-unchanged-image-builds-design.md
      - name: Promote and version-tag changed services
        run: |
          # Deliberately not `set -e`: a service that fails must not prevent the
          # others from being promoted. Failures are collected and re-raised at
          # the end, after every service has had its turn.
          set -uo pipefail

          REPO_LC=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "Promoting release $RELEASE_TAG (commit $RELEASE_SHA)"

          SERVICES=(backend frontend otel-collector loki prometheus grafana tempo)

          # Manifest digest a tag resolves to, or empty if the tag doesn't exist.
          digest() {
            docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1" 2>/dev/null || true
          }

          # Promote one service. Returns non-zero on failure; sets `changed_flag`
          # when :production actually moved.
          promote_one() {
            name="$1"
            image="ghcr.io/${REPO_LC}-${name}"

            hash=$(node scripts/service-content-hash.cjs "$name" "$RELEASE_SHA") || return 1
            src="${image}:tree-${hash}"

            # Wait for the source image — covers a release racing a still-running build.
            ready=""
            for attempt in $(seq 1 "$IMAGE_WAIT_ATTEMPTS"); do
              if docker buildx imagetools inspect "$src" > /dev/null 2>&1; then
                ready=1
                break
              fi
              if [ "$attempt" -lt "$IMAGE_WAIT_ATTEMPTS" ]; then
                echo "  $name: $src not ready (attempt $attempt/$IMAGE_WAIT_ATTEMPTS); waiting ${IMAGE_WAIT_SECONDS}s..."
                sleep "$IMAGE_WAIT_SECONDS"
              fi
            done
            if [ -z "$ready" ]; then
              echo "  $name: source image not available after $(( IMAGE_WAIT_ATTEMPTS * IMAGE_WAIT_SECONDS )) seconds: $src" >&2
              return 1
            fi

            # Version snapshot for ALL services (cheap registry manifest copy) so
            # the release tag labels a complete per-service image set for rollback.
            docker buildx imagetools create --tag "${image}:${RELEASE_TAG}" "$src" || return 1

            # Move :production only when this release's image differs from it.
            # `imagetools create` wraps a single manifest in an OCI index, so
            # :production's own digest won't equal the :tree-<hash> manifest
            # digest. Treat it as unchanged if the source digest matches
            # production's own digest OR any of its child manifest digests.
            src_digest=$(digest "$src")
            prod_self=$(digest "${image}:production")
            prod_children=$(docker buildx imagetools inspect --raw "${image}:production" 2>/dev/null \
              | jq -r '.manifests[]?.digest' 2>/dev/null || true)
            unchanged=""
            if [ -n "$src_digest" ]; then
              if [ "$src_digest" = "$prod_self" ]; then
                unchanged=1
              else
                for d in $prod_children; do
                  if [ "$d" = "$src_digest" ]; then unchanged=1; break; fi
                done
              fi
            fi
            if [ -n "$unchanged" ]; then
              echo "  $name: unchanged (production already serves $src_digest)"
              return 0
            fi

            echo "  $name: changed; re-tagging :production"
            docker buildx imagetools create --tag "${image}:production" "$src" || return 1
            changed_flag=1
            return 0
          }

          changed=()
          failed=()
          for name in "${SERVICES[@]}"; do
            changed_flag=""
            if promote_one "$name"; then
              if [ -n "$changed_flag" ]; then changed+=("$name"); fi
            else
              echo "  $name: PROMOTION FAILED" >&2
              failed+=("$name")
              continue
            fi
          done

          # The summary is the deploy instruction. A green run here means the
          # images are pinned, NOT that production is serving them.
          {
            echo "### Promotion — $RELEASE_TAG"
            echo ""
            if [ ${#changed[@]} -gt 0 ]; then
              echo "Re-tagged \`:production\`: ${changed[*]}"
              echo ""
              echo "**Not deployed yet.** The Dokploy panel is LAN-only, so CI cannot trigger it."
              echo "Redeploy these in Dokploy to ship them:"
              for n in "${changed[@]}"; do echo "- \`$n\`"; done
            else
              echo "No service changed — production already serves this release."
            fi
            if [ ${#failed[@]} -gt 0 ]; then
              echo ""
              echo "**Failed to promote:** ${failed[*]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#failed[@]} -gt 0 ]; then
            echo "Promotion failed for: ${failed[*]}" >&2
            exit 1
          fi
