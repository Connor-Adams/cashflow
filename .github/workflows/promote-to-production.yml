name: promote-to-production

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-to-production
  cancel-in-progress: false

env:
  RAILWAY_BACKEND_SERVICE_ID: 42977748-ab5c-4552-a206-faf86d353e5b
  RAILWAY_FRONTEND_SERVICE_ID: e0dc05b7-3961-4d4f-aea9-bed3810ea2f5
  RAILWAY_OTEL_COLLECTOR_SERVICE_ID: "8e2cf3d2-7255-43d7-8237-6dd4b97a6699"
  RAILWAY_LOKI_SERVICE_ID: "90312934-b760-4cb4-aae5-2c1eddf0b483"
  RAILWAY_PROMETHEUS_SERVICE_ID: ""
  RAILWAY_GRAFANA_SERVICE_ID: 0649a415-40cb-4d45-b28f-38111a77b959
  RAILWAY_TEMPO_SERVICE_ID: 977ae051-e712-4194-a564-f821346ad098
  IMAGE_WAIT_ATTEMPTS: 30
  IMAGE_WAIT_SECONDS: 10

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag to source commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_LC=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')

          REF=$(gh api "/repos/$REPO/git/ref/tags/$RELEASE_TAG")
          OBJ_TYPE=$(echo "$REF" | jq -r .object.type)
          OBJ_SHA=$(echo "$REF" | jq -r .object.sha)
          if [ "$OBJ_TYPE" = "tag" ]; then
            COMMIT_SHA=$(gh api "/repos/$REPO/git/tags/$OBJ_SHA" --jq .object.sha)
          else
            COMMIT_SHA=$OBJ_SHA
          fi
          SHA_SHORT=$(echo "$COMMIT_SHA" | cut -c1-7)

          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${REPO_LC}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${REPO_LC}-frontend" >> "$GITHUB_OUTPUT"
          echo "otel_collector=ghcr.io/${REPO_LC}-otel-collector" >> "$GITHUB_OUTPUT"
          echo "loki=ghcr.io/${REPO_LC}-loki" >> "$GITHUB_OUTPUT"
          echo "prometheus=ghcr.io/${REPO_LC}-prometheus" >> "$GITHUB_OUTPUT"
          echo "grafana=ghcr.io/${REPO_LC}-grafana" >> "$GITHUB_OUTPUT"
          echo "tempo=ghcr.io/${REPO_LC}-tempo" >> "$GITHUB_OUTPUT"
          echo "Released tag $RELEASE_TAG -> commit $COMMIT_SHA (short $SHA_SHORT)"

      - name: Verify source images exist for this commit
        env:
          BACKEND: ${{ steps.resolve.outputs.backend }}
          FRONTEND: ${{ steps.resolve.outputs.frontend }}
          OTEL_COLLECTOR: ${{ steps.resolve.outputs.otel_collector }}
          LOKI: ${{ steps.resolve.outputs.loki }}
          PROMETHEUS: ${{ steps.resolve.outputs.prometheus }}
          GRAFANA: ${{ steps.resolve.outputs.grafana }}
          TEMPO: ${{ steps.resolve.outputs.tempo }}
          SHA_SHORT: ${{ steps.resolve.outputs.sha_short }}
        run: |
          set -euo pipefail
          echo "Inspecting source images at :sha-$SHA_SHORT"
          for attempt in $(seq 1 "$IMAGE_WAIT_ATTEMPTS"); do
            if docker buildx imagetools inspect "$BACKEND:sha-$SHA_SHORT" > /dev/null 2>&1 && \
              docker buildx imagetools inspect "$FRONTEND:sha-$SHA_SHORT" > /dev/null 2>&1 && \
              docker buildx imagetools inspect "$OTEL_COLLECTOR:sha-$SHA_SHORT" > /dev/null 2>&1 && \
              docker buildx imagetools inspect "$LOKI:sha-$SHA_SHORT" > /dev/null 2>&1 && \
              docker buildx imagetools inspect "$PROMETHEUS:sha-$SHA_SHORT" > /dev/null 2>&1 && \
              docker buildx imagetools inspect "$GRAFANA:sha-$SHA_SHORT" > /dev/null 2>&1 && \
              docker buildx imagetools inspect "$TEMPO:sha-$SHA_SHORT" > /dev/null 2>&1; then
              echo "Source images are available."
              exit 0
            fi

            if [ "$attempt" -lt "$IMAGE_WAIT_ATTEMPTS" ]; then
              echo "Source images not ready yet (attempt $attempt/$IMAGE_WAIT_ATTEMPTS). Waiting ${IMAGE_WAIT_SECONDS}s..."
              sleep "$IMAGE_WAIT_SECONDS"
            fi
          done

          echo "Source images are not available after $(( IMAGE_WAIT_ATTEMPTS * IMAGE_WAIT_SECONDS )) seconds:" >&2
          echo "  $BACKEND:sha-$SHA_SHORT" >&2
          echo "  $FRONTEND:sha-$SHA_SHORT" >&2
          echo "  $OTEL_COLLECTOR:sha-$SHA_SHORT" >&2
          echo "  $LOKI:sha-$SHA_SHORT" >&2
          echo "  $PROMETHEUS:sha-$SHA_SHORT" >&2
          echo "  $GRAFANA:sha-$SHA_SHORT" >&2
          echo "  $TEMPO:sha-$SHA_SHORT" >&2
          exit 1

      - name: Re-tag backend image as release version and :production
        env:
          BACKEND: ${{ steps.resolve.outputs.backend }}
          SHA_SHORT: ${{ steps.resolve.outputs.sha_short }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$BACKEND:$RELEASE_TAG" \
            --tag "$BACKEND:production" \
            "$BACKEND:sha-$SHA_SHORT"

      - name: Re-tag frontend image as release version and :production
        env:
          FRONTEND: ${{ steps.resolve.outputs.frontend }}
          SHA_SHORT: ${{ steps.resolve.outputs.sha_short }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$FRONTEND:$RELEASE_TAG" \
            --tag "$FRONTEND:production" \
            "$FRONTEND:sha-$SHA_SHORT"

      - name: Re-tag otel-collector image as release version and :production
        env:
          OTEL_COLLECTOR: ${{ steps.resolve.outputs.otel_collector }}
          SHA_SHORT: ${{ steps.resolve.outputs.sha_short }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$OTEL_COLLECTOR:$RELEASE_TAG" \
            --tag "$OTEL_COLLECTOR:production" \
            "$OTEL_COLLECTOR:sha-$SHA_SHORT"

      - name: Re-tag loki image as release version and :production
        env:
          LOKI: ${{ steps.resolve.outputs.loki }}
          SHA_SHORT: ${{ steps.resolve.outputs.sha_short }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$LOKI:$RELEASE_TAG" \
            --tag "$LOKI:production" \
            "$LOKI:sha-$SHA_SHORT"

      - name: Re-tag prometheus image as release version and :production
        env:
          PROMETHEUS: ${{ steps.resolve.outputs.prometheus }}
          SHA_SHORT: ${{ steps.resolve.outputs.sha_short }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$PROMETHEUS:$RELEASE_TAG" \
            --tag "$PROMETHEUS:production" \
            "$PROMETHEUS:sha-$SHA_SHORT"

      - name: Re-tag grafana image as release version and :production
        env:
          GRAFANA: ${{ steps.resolve.outputs.grafana }}
          SHA_SHORT: ${{ steps.resolve.outputs.sha_short }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$GRAFANA:$RELEASE_TAG" \
            --tag "$GRAFANA:production" \
            "$GRAFANA:sha-$SHA_SHORT"

      - name: Re-tag tempo image as release version and :production
        env:
          TEMPO: ${{ steps.resolve.outputs.tempo }}
          SHA_SHORT: ${{ steps.resolve.outputs.sha_short }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$TEMPO:$RELEASE_TAG" \
            --tag "$TEMPO:production" \
            "$TEMPO:sha-$SHA_SHORT"

      - name: Install Railway CLI
        run: |
          set -euo pipefail
          npm install -g @railway/cli

      - name: Trigger Railway backend redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN secret is not set" >&2
            exit 1
          fi
          railway redeploy --service "$RAILWAY_BACKEND_SERVICE_ID" -y

      - name: Trigger Railway frontend redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN secret is not set" >&2
            exit 1
          fi
          railway redeploy --service "$RAILWAY_FRONTEND_SERVICE_ID" -y

      - name: Trigger Railway otel-collector redeploy
        if: env.RAILWAY_OTEL_COLLECTOR_SERVICE_ID != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN secret is not set" >&2
            exit 1
          fi
          railway redeploy --service "$RAILWAY_OTEL_COLLECTOR_SERVICE_ID" -y

      - name: Trigger Railway loki redeploy
        if: env.RAILWAY_LOKI_SERVICE_ID != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN secret is not set" >&2
            exit 1
          fi
          railway redeploy --service "$RAILWAY_LOKI_SERVICE_ID" -y

      - name: Trigger Railway prometheus redeploy
        if: env.RAILWAY_PROMETHEUS_SERVICE_ID != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN secret is not set" >&2
            exit 1
          fi
          railway redeploy --service "$RAILWAY_PROMETHEUS_SERVICE_ID" -y

      - name: Trigger Railway grafana redeploy
        if: env.RAILWAY_GRAFANA_SERVICE_ID != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN secret is not set" >&2
            exit 1
          fi
          railway redeploy --service "$RAILWAY_GRAFANA_SERVICE_ID" -y

      - name: Trigger Railway tempo redeploy
        if: env.RAILWAY_TEMPO_SERVICE_ID != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN secret is not set" >&2
            exit 1
          fi
          railway redeploy --service "$RAILWAY_TEMPO_SERVICE_ID" -y
