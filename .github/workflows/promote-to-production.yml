name: promote-to-production

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-to-production
  cancel-in-progress: false

env:
  RAILWAY_BACKEND_SERVICE_ID: 42977748-ab5c-4552-a206-faf86d353e5b
  RAILWAY_FRONTEND_SERVICE_ID: e0dc05b7-3961-4d4f-aea9-bed3810ea2f5
  RAILWAY_OTEL_COLLECTOR_SERVICE_ID: "8e2cf3d2-7255-43d7-8237-6dd4b97a6699"
  RAILWAY_LOKI_SERVICE_ID: "90312934-b760-4cb4-aae5-2c1eddf0b483"
  RAILWAY_PROMETHEUS_SERVICE_ID: "03a89189-868d-44af-89cf-d096a1c6e61a"
  RAILWAY_GRAFANA_SERVICE_ID: 0649a415-40cb-4d45-b28f-38111a77b959
  RAILWAY_TEMPO_SERVICE_ID: 977ae051-e712-4194-a564-f821346ad098
  IMAGE_WAIT_ATTEMPTS: 30
  IMAGE_WAIT_SECONDS: 10

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      REPO: ${{ github.repository }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      # Check out the released commit so we can recompute each service's content
      # hash exactly as build-images.yml did. `ref: <tag>` resolves annotated
      # tags to their commit transparently.
      - name: Check out release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Railway CLI
        # Pinned: @railway/cli 4.66.1 (2026-06-03) sends a GraphQL query with a
        # `deletedAt` field on VolumeInstance that Railway's API rejects, crashing
        # `railway redeploy` ("Cannot query field deletedAt on type VolumeInstance").
        # 4.66.0 is the last version that promotes cleanly. Bump deliberately after
        # verifying redeploy works against the live API.
        run: npm install -g @railway/cli@4.66.0

      # Resolve each service by its content hash (:tree-<hash>), stamp every
      # service with the release version tag, and re-tag :production + redeploy
      # ONLY the services whose image actually differs from what's live. Images
      # are NOT rebuilt here — build-images.yml already pushed :tree-<hash>.
      # Design: docs/superpowers/specs/2026-06-02-skip-unchanged-image-builds-design.md
      - name: Promote, version-tag, and redeploy changed services
        run: |
          set -euo pipefail

          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN secret is not set" >&2
            exit 1
          fi

          REPO_LC=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "Promoting release $RELEASE_TAG (commit $RELEASE_SHA)"

          # name|railway-service-id
          SERVICES=(
            "backend|$RAILWAY_BACKEND_SERVICE_ID"
            "frontend|$RAILWAY_FRONTEND_SERVICE_ID"
            "otel-collector|$RAILWAY_OTEL_COLLECTOR_SERVICE_ID"
            "loki|$RAILWAY_LOKI_SERVICE_ID"
            "prometheus|$RAILWAY_PROMETHEUS_SERVICE_ID"
            "grafana|$RAILWAY_GRAFANA_SERVICE_ID"
            "tempo|$RAILWAY_TEMPO_SERVICE_ID"
          )

          # Manifest digest a tag resolves to, or empty if the tag doesn't exist.
          digest() {
            docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1" 2>/dev/null || true
          }

          for entry in "${SERVICES[@]}"; do
            IFS='|' read -r name service_id <<< "$entry"
            image="ghcr.io/${REPO_LC}-${name}"
            hash=$(node scripts/service-content-hash.cjs "$name" "$RELEASE_SHA")
            src="${image}:tree-${hash}"

            # Wait for the source image — covers a release racing a still-running build.
            ready=""
            for attempt in $(seq 1 "$IMAGE_WAIT_ATTEMPTS"); do
              if docker buildx imagetools inspect "$src" > /dev/null 2>&1; then
                ready=1
                break
              fi
              if [ "$attempt" -lt "$IMAGE_WAIT_ATTEMPTS" ]; then
                echo "  $name: $src not ready (attempt $attempt/$IMAGE_WAIT_ATTEMPTS); waiting ${IMAGE_WAIT_SECONDS}s..."
                sleep "$IMAGE_WAIT_SECONDS"
              fi
            done
            if [ -z "$ready" ]; then
              echo "Source image not available after $(( IMAGE_WAIT_ATTEMPTS * IMAGE_WAIT_SECONDS )) seconds: $src" >&2
              exit 1
            fi

            # Version snapshot for ALL services (cheap registry manifest copy) so
            # the release tag labels a complete per-service image set for rollback.
            docker buildx imagetools create --tag "${image}:${RELEASE_TAG}" "$src"

            # Redeploy only when this release's image differs from production.
            # `imagetools create` wraps a single manifest in an OCI index, so
            # :production's own digest won't equal the :tree-<hash> manifest
            # digest. Treat it as unchanged if the source digest matches
            # production's own digest OR any of its child manifest digests.
            src_digest=$(digest "$src")
            prod_self=$(digest "${image}:production")
            prod_children=$(docker buildx imagetools inspect --raw "${image}:production" 2>/dev/null \
              | jq -r '.manifests[]?.digest' 2>/dev/null || true)
            unchanged=""
            if [ -n "$src_digest" ]; then
              if [ "$src_digest" = "$prod_self" ]; then
                unchanged=1
              else
                for d in $prod_children; do
                  if [ "$d" = "$src_digest" ]; then unchanged=1; break; fi
                done
              fi
            fi
            if [ -n "$unchanged" ]; then
              echo "  $name: unchanged (production already serves $src_digest); skipping redeploy"
              continue
            fi

            echo "  $name: changed; re-tagging :production and redeploying"
            docker buildx imagetools create --tag "${image}:production" "$src"
            if [ -n "$service_id" ]; then
              railway redeploy --service "$service_id" -y
            else
              echo "  $name: no Railway service id set; skipped redeploy"
            fi
          done
