name: build-images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
            needs_app_args: 'true'
          - name: frontend
            context: .
            file: frontend/Dockerfile
            needs_app_args: 'true'
          - name: otel-collector
            context: infra/otel-collector
            file: infra/otel-collector/Dockerfile
            needs_app_args: 'false'
          - name: loki
            context: infra/loki
            file: infra/loki/Dockerfile
            needs_app_args: 'false'
          - name: prometheus
            context: infra/prometheus
            file: infra/prometheus/Dockerfile
            needs_app_args: 'false'
          - name: grafana
            context: infra/grafana
            file: infra/grafana/Dockerfile
            needs_app_args: 'false'
          - name: tempo
            context: infra/tempo
            file: infra/tempo/Dockerfile
            needs_app_args: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(git rev-parse HEAD)
          APP_VERSION=$(git describe --tags --always --dirty)
          echo "image=ghcr.io/${REPO_LC}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          # Keep v5's single-manifest output. build-push v6+ enables provenance
          # attestations by default, turning each single-arch image into an
          # index with an extra unknown/unknown manifest. The promote re-tag
          # flow (imagetools create/inspect) doesn't need that.
          provenance: false
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:main
          build-args: |
            VITE_API_BASE=${{ secrets.VITE_API_BASE }}
            APP_VERSION=${{ steps.meta.outputs.app_version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
