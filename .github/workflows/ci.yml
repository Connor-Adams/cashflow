name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Archive node_modules
        run: |
          paths=(node_modules)
          for ws in backend frontend shared; do
            [ -d "$ws/node_modules" ] && paths+=("$ws/node_modules")
          done
          tar -cf node_modules.tar "${paths[@]}"

      - name: Upload node_modules artifact
        uses: actions/upload-artifact@v7
        with:
          name: node_modules
          path: node_modules.tar
          retention-days: 1
          if-no-files-found: error

  workflow-tests:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Run workflow tests
        run: yarn test:workflows

  backend-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Run backend unit tests
        env:
          # Dump raw V8 coverage as a side effect of this gating run (no effect
          # on pass/fail). The `coverage` job merges it with integration
          # coverage via `c8 report`, so the suite is no longer run twice.
          NODE_V8_COVERAGE: ${{ github.workspace }}/backend/.v8cov
        run: yarn workspace cashflow-backend run test

      - name: Upload backend unit coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cov-backend-unit
          path: backend/.v8cov
          retention-days: 1
          if-no-files-found: ignore

  backend-test-integration:
    needs: install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Run backend integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          NODE_V8_COVERAGE: ${{ github.workspace }}/backend/.v8cov
        run: yarn workspace cashflow-backend run test:integration

      - name: Upload backend integration coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cov-backend-integration
          path: backend/.v8cov
          retention-days: 1
          if-no-files-found: ignore

  backend-build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Cache TS build state
        uses: actions/cache@v5
        with:
          path: backend/dist/.tsbuildinfo
          key: ${{ runner.os }}-backend-tsbuild-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-backend-tsbuild-

      - name: Build backend
        run: yarn workspace cashflow-backend run build

  code-audit:
    needs: install
    runs-on: ubuntu-latest
    # Informational for now: surfaces dead code + complexity (fallow) and
    # duplication (jscpd) without blocking merges, and posts a whole-repo
    # snapshot as a sticky PR comment. Flip the steps to required once the
    # baseline is driven down. See CONTRIBUTING.md for `yarn audit:code`.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          # fallow health derives churn/hotspots from git history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Dead code & complexity (fallow)
        continue-on-error: true
        run: |
          mkdir -p reports
          # fallow exits non-zero when it finds issues; don't let that (under
          # bash -e) abort the step before the second command runs.
          yarn --silent fallow dead-code --format json > reports/fallow-deadcode.json || true
          yarn --silent fallow health --format json > reports/fallow-health.json || true

      - name: Duplicate code (jscpd)
        continue-on-error: true
        run: yarn jscpd --reporters console,json,html

      - name: Build audit summary
        if: always()
        run: node scripts/audit-summary.cjs > reports/audit-comment.md

      - name: Upload jscpd report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jscpd-report
          path: reports/jscpd
          retention-days: 7
          if-no-files-found: ignore

      - name: Post audit summary comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('reports/audit-comment.md', 'utf8');
            const marker = '<!-- code-audit-summary -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            // Our rendered summary replaces fallow's native report comment
            // (disabled via comment:false in fallow.yml). Clean up any leftover.
            const stale = comments.find(
              (c) => c.body && c.body.includes('<!-- fallow-id: fallow-results -->'),
            );
            if (stale) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: stale.id });
            }
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  frontend-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Run frontend tests
        # vitest run --coverage still fails on test failure, so this stays a
        # valid gate while also emitting the frontend coverage report.
        run: yarn workspace frontend run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cov-frontend
          path: frontend/coverage
          retention-days: 1
          if-no-files-found: ignore

  frontend-build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Cache vite build state
        uses: actions/cache@v5
        with:
          path: |
            frontend/node_modules/.tmp
            frontend/node_modules/.vite
          key: ${{ runner.os }}-frontend-vite-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-frontend-vite-

      - name: Build frontend
        run: yarn workspace frontend run build

  coverage:
    # Merge-only, report-only, NOT a required check. The gating jobs
    # (backend-test, backend-test-integration, frontend-test) now emit coverage
    # as a side effect, so this job runs no tests — it just stitches the raw V8
    # data into one report. The suite is no longer executed twice per CI.
    # To enforce a floor later, add `--check-coverage` to the c8 report step and
    # `coverage.thresholds` to vitest, then make this job a required check.
    needs: [backend-test, backend-test-integration, frontend-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      # Unit (sqlite) and integration (postgres) ran in separate jobs/processes
      # — the models singleton binds one dialect per process — each dumping raw
      # V8 coverage (NODE_V8_COVERAGE) to backend/.v8cov. Pull both into one temp
      # dir; V8 filenames are unique per process so they don't collide, and
      # `c8 report` merges them exactly like the old single-job --clean=false
      # accumulation. Node embeds source-map-cache in the dumps, so c8 remaps to
      # .ts even though tsx didn't run in this job.
      - name: Download backend unit coverage data
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: cov-backend-unit
          path: backend/.v8cov

      - name: Download backend integration coverage data
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: cov-backend-integration
          path: backend/.v8cov

      - name: Build merged backend coverage report
        continue-on-error: true
        run: yarn workspace cashflow-backend run coverage:report

      - name: Download frontend coverage
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: cov-frontend
          path: frontend/coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            backend/coverage
            frontend/coverage
          retention-days: 7
          if-no-files-found: ignore
