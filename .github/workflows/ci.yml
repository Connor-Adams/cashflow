name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Archive node_modules
        run: |
          paths=(node_modules)
          for ws in backend frontend shared; do
            [ -d "$ws/node_modules" ] && paths+=("$ws/node_modules")
          done
          tar -cf node_modules.tar "${paths[@]}"

      - name: Upload node_modules artifact
        uses: actions/upload-artifact@v7
        with:
          name: node_modules
          path: node_modules.tar
          retention-days: 1
          if-no-files-found: error

  workflow-tests:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Run workflow tests
        run: yarn test:workflows

  backend-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Run shared contract tests
        run: yarn workspace @cashflow/shared run test

      - name: Run backend unit tests
        run: yarn workspace cashflow-backend run test

  backend-test-integration:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          pg_isready
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

      - name: Run backend integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: yarn workspace cashflow-backend run test:integration

  backend-build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Cache TS build state
        uses: actions/cache@v5
        with:
          path: backend/dist/.tsbuildinfo
          key: ${{ runner.os }}-backend-tsbuild-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-backend-tsbuild-

      - name: Build backend
        run: yarn workspace cashflow-backend run build

  code-audit:
    needs: install
    runs-on: ubuntu-latest
    # Surfaces dead code + complexity (fallow) and duplication (jscpd), posts a
    # whole-repo snapshot as a sticky PR comment, and RATCHETS the baseline: the
    # final "Enforce audit baseline" step fails the job if any zeroable dead-code
    # category regresses above 0 or duplication rises above the ceiling (issue
    # #469). Complexity stays informational — it never blocks. Make this job a
    # required check on `main` so the line holds. See CONTRIBUTING.md › Code
    # health and scripts/audit-gate.cjs.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          # fallow health derives churn/hotspots from git history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Dead code & complexity (fallow)
        continue-on-error: true
        run: |
          mkdir -p reports
          # fallow exits non-zero when it finds issues; don't let that (under
          # bash -e) abort the step before the second command runs.
          yarn --silent fallow dead-code --format json > reports/fallow-deadcode.json || true
          yarn --silent fallow health --format json > reports/fallow-health.json || true

      - name: Duplicate code (jscpd)
        continue-on-error: true
        run: yarn jscpd --reporters console,json,html

      - name: Build audit summary
        if: always()
        run: node scripts/audit-summary.cjs > reports/audit-comment.md

      - name: Upload jscpd report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jscpd-report
          path: reports/jscpd
          retention-days: 7
          if-no-files-found: ignore

      - name: Post audit summary comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('reports/audit-comment.md', 'utf8');
            const marker = '<!-- code-audit-summary -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            // Our rendered summary replaces fallow's native report comment
            // (disabled via comment:false in fallow.yml). Clean up any leftover.
            const stale = comments.find(
              (c) => c.body && c.body.includes('<!-- fallow-id: fallow-results -->'),
            );
            if (stale) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: stale.id });
            }
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      # The baseline ratchet. Runs LAST so the snapshot comment is always posted
      # first (reviewers see the numbers even on failure). `if: always()` keeps
      # it from being skipped by an earlier continue-on-error step. This is the
      # step that decides the job's pass/fail — it reads the same reports the
      # summary renders and fails on any zeroable-category regression or
      # duplication above the ceiling. Complexity is never consulted here.
      - name: Enforce audit baseline (ratchet)
        if: always()
        run: node scripts/audit-gate.cjs

  frontend-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Run frontend tests
        run: yarn workspace frontend run test

  frontend-build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v8
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Cache vite build state
        uses: actions/cache@v5
        with:
          path: |
            frontend/node_modules/.tmp
            frontend/node_modules/.vite
          key: ${{ runner.os }}-frontend-vite-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-frontend-vite-

      - name: Build frontend
        run: yarn workspace frontend run build
