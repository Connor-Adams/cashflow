name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Archive node_modules
        run: |
          paths=(node_modules)
          for ws in backend frontend shared; do
            [ -d "$ws/node_modules" ] && paths+=("$ws/node_modules")
          done
          tar -cf node_modules.tar "${paths[@]}"

      - name: Upload node_modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules.tar
          retention-days: 1
          if-no-files-found: error

  workflow-tests:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Run workflow tests
        run: yarn test:workflows

  backend-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Run backend unit tests
        run: yarn workspace cashflow-backend run test

  backend-test-integration:
    needs: install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Run backend integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: yarn workspace cashflow-backend run test:integration

  backend-build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Cache TS build state
        uses: actions/cache@v4
        with:
          path: backend/dist/.tsbuildinfo
          key: ${{ runner.os }}-backend-tsbuild-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-backend-tsbuild-

      - name: Build backend
        run: yarn workspace cashflow-backend run build

  code-audit:
    needs: install
    runs-on: ubuntu-latest
    # Informational for now: surfaces dead code + complexity (fallow) and
    # duplication (jscpd) without blocking merges, and posts a whole-repo
    # snapshot as a sticky PR comment. Flip the steps to required once the
    # baseline is driven down. See CONTRIBUTING.md for `yarn audit:code`.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Dead code & complexity (fallow)
        continue-on-error: true
        run: |
          mkdir -p reports
          yarn --silent fallow dead-code --format json > reports/fallow-deadcode.json
          yarn --silent fallow health --format json > reports/fallow-health.json

      - name: Duplicate code (jscpd)
        continue-on-error: true
        run: yarn jscpd --reporters console,json,html

      - name: Build audit summary
        if: always()
        run: node scripts/audit-summary.cjs > reports/audit-comment.md

      - name: Upload jscpd report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-report
          path: reports/jscpd
          retention-days: 7
          if-no-files-found: ignore

      - name: Post audit summary comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('reports/audit-comment.md', 'utf8');
            const marker = '<!-- code-audit-summary -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  frontend-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Run frontend tests
        run: yarn workspace frontend run test

  frontend-build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Cache vite build state
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules/.tmp
            frontend/node_modules/.vite
          key: ${{ runner.os }}-frontend-vite-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-frontend-vite-

      - name: Build frontend
        run: yarn workspace frontend run build
