name: Fallow

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: fallow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: PR code intelligence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Fallow audit
        uses: fallow-rs/fallow@v2
        with:
          command: audit
          comment: true
          review-comments: true
          review-guidance: true
          annotations: false
          diff-filter: added
          max-comments: 25
          fail-on-issues: false
