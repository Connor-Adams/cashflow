# Dependabot keeps SHA-pinned GitHub Actions current.
# Third-party actions in .github/workflows/ are pinned to a full commit SHA
# (with a trailing `# vX` version comment) for supply-chain safety; the
# github-actions updater bumps both the SHA and the comment when new releases
# land. See issue #859.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
