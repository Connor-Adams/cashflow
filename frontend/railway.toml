[build]
builder = "RAILPACK"
buildCommand = "yarn workspace frontend run build"
watchPatterns = [
  "frontend/**",
  "shared/**",
  "package.json",
  "yarn.lock"
]

[deploy]
startCommand = "yarn workspace frontend run preview -- --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
