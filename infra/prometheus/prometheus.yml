global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # App metrics emitted by the OTLP -> prometheus pipeline (cashflow_http_*,
  # job tick counters, etc.). The `up{job="cashflow-otel-collector"}` series
  # generated by this scrape is what powers the OtelCollectorScrapeDown
  # alert in infra/grafana/provisioning/alerting/observability-stack.yaml.
  - job_name: cashflow-otel-collector
    static_configs:
      - targets:
          - otel-collector.railway.internal:9464

  # Self-telemetry from the collector itself (otelcol_exporter_*,
  # otelcol_receiver_*, otelcol_processor_*). These series surface the
  # otlphttp/tempo and loki exporter failure counters that feed the
  # TempoExportFailing / LokiExportFailing alerts. Without this scrape the
  # alerts have no data and tempo can be silently down again (issue #371).
  - job_name: cashflow-otel-collector-self
    static_configs:
      - targets:
          - otel-collector.railway.internal:8888
