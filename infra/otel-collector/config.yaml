# infra/otel-collector/config.yaml
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "https://${env:PUBLIC_FRONTEND_ORIGIN}"
            - "http://localhost:5173"
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete

exporters:
  loki:
    endpoint: http://${env:LOKI_HOST}:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: false
      job: true
  prometheus:
    endpoint: 0.0.0.0:9464
  otlphttp/tempo:
    endpoint: http://${env:TEMPO_HOST}:4318
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo]
  telemetry:
    logs:
      level: info
    # Expose the collector's own internal metrics (otelcol_exporter_*,
    # otelcol_receiver_*, otelcol_processor_*) so Prometheus can scrape them
    # over Railway's private network. The default bind is 127.0.0.1:8888,
    # which only works inside the container; 0.0.0.0:8888 is required so the
    # prometheus service can reach `otel-collector.railway.internal:8888`.
    # These metrics drive the TempoExportFailing / LokiExportFailing alert
    # rules — see
    # https://github.com/Connor-Adams/cashflow/blob/main/infra/grafana/provisioning/alerting/observability-stack.yaml#L29 (tempo)
    # https://github.com/Connor-Adams/cashflow/blob/main/infra/grafana/provisioning/alerting/observability-stack.yaml#L87 (loki)
    metrics:
      address: 0.0.0.0:8888
