# infra/docker-compose.yml — local dev observability stack
services:
  loki:
    build: ./loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki

  tempo:
    build: ./tempo
    ports:
      - "3200:3200"
      - "4319:4318"   # OTLP HTTP — collector uses 4318; tempo reuses; remap to 4319 to avoid clash
    volumes:
      - tempo-data:/tempo

  otel-collector:
    build: ./otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - LOKI_HOST=loki
      - TEMPO_HOST=tempo
      - PUBLIC_FRONTEND_ORIGIN=localhost:5173
    depends_on:
      - loki
      - tempo

  grafana:
    build: ./grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  loki-data:
  grafana-data:
  tempo-data:
